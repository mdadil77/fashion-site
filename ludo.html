<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080a10">
  <title>Swiplay — Ludo Classic</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
  <script>const SERVER_URL = 'https://swiplay-server.onrender.com';</script>

  <style>
    :root {
      --bg1: #1a2035; --bg2: #080a10;
      --glass: rgba(22, 26, 43, 0.72); --border: rgba(255,255,255,0.1);
      --me: #00ff66; --opp: #ff0055; --gold: #ffcc00; --muted: #8f96a3;
      --red: #ff3b5c; --green: #00e676; --yellow: #ffca28; --blue: #29b6f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; height: 100dvh;
      background: radial-gradient(circle at center, var(--bg1) 0%, var(--bg2) 100%);
      color: #fff; overflow: hidden; display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      overscroll-behavior: none;
    }
    button { background: none; border: none; color: inherit; cursor: pointer; font: inherit; outline: none; }
    a { text-decoration: none; color: inherit; }
    input { font: inherit; outline: none; border: none; background: transparent; color: inherit; }

    /* Top Bar */
    .top-bar { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: rgba(22,26,43,.6); border-bottom: 1px solid var(--border); z-index: 20; }
    .btn-ghost { background: rgba(255,255,255,.1); color: #fff; padding: 6px 12px; border-radius: 16px; font-weight: 700; font-size: .85rem; border: 1px solid var(--border); }
    .mode-badge { background: rgba(0,255,102,.12); border: 1px solid var(--me); color: var(--me); padding: 4px 10px; border-radius: 14px; font-weight: 800; font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; }
    .room-code { font-family: ui-monospace, monospace; font-weight: 800; font-size: .85rem; letter-spacing: 2px; color: var(--gold); }
    .spacer { flex: 1; }
    .icon-btn { background: rgba(255,255,255,.08); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; border: 1px solid var(--border); }

    /* Turn & Players Strip */
    .players-bar { flex-shrink: 0; display: flex; justify-content: center; gap: 8px; padding: 6px 10px; background: rgba(8,10,16,.5); border-bottom: 1px solid var(--border); }
    .p-chip { flex: 1; max-width: 120px; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 12px; background: rgba(255,255,255,.04); border: 2px solid transparent; opacity: .55; transition: .25s; }
    .p-chip.active { opacity: 1; background: rgba(255,255,255,.1); transform: scale(1.03); }
    .p-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .p-name { font-size: .75rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-chip.c-0.active { border-color: var(--red); box-shadow: 0 0 12px rgba(255,59,92,.35); }
    .p-chip.c-1.active { border-color: var(--green); box-shadow: 0 0 12px rgba(0,230,118,.35); }
    .p-chip.c-2.active { border-color: var(--yellow); box-shadow: 0 0 12px rgba(255,202,40,.35); }
    .p-chip.c-3.active { border-color: var(--blue); box-shadow: 0 0 12px rgba(41,182,246,.35); }

    /* Arena & 15x15 Board */
    .arena { flex: 1; display: flex; justify-content: center; align-items: center; padding: 8px; min-height: 0; overflow: hidden; position: relative; }
    .board-wrap {
      height: 100%; max-height: min(94vw, 500px); max-width: 94vw;
      aspect-ratio: 1 / 1; position: relative; container-type: inline-size;
      border-radius: 14px; padding: 4px; background: #141929;
      box-shadow: 0 16px 45px rgba(0,0,0,.75), 0 0 0 2px rgba(255,255,255,.08);
    }
    .board {
      width: 100%; height: 100%; display: grid;
      grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr);
      border-radius: 10px; overflow: hidden; background: #e8ecf4; position: relative;
    }
    .cell { border: 0.5px solid rgba(15,23,42,.15); position: relative; display: flex; align-items: center; justify-content: center; }
    .cell.yard { border: none; }
    .cell.y-0 { background: var(--red); } .cell.y-1 { background: var(--green); }
    .cell.y-2 { background: var(--yellow); } .cell.y-3 { background: var(--blue); }
    .cell.yard-inner { background: rgba(255,255,255,.92); border: none; }
    .cell.path-0 { background: rgba(255,59,92,.85); } .cell.path-1 { background: rgba(0,230,118,.85); }
    .cell.path-2 { background: rgba(255,202,40,.85); } .cell.path-3 { background: rgba(41,182,246,.85); }
    .cell.star::after { content: '★'; font-size: 4.2cqw; color: rgba(15,23,42,.45); position: absolute; pointer-events: none; }
    .cell.path-0.star::after, .cell.path-1.star::after, .cell.path-2.star::after, .cell.path-3.star::after { color: rgba(255,255,255,.9); }

    /* Center Home Triangle */
    .center-home {
      grid-column: 7 / 10; grid-row: 7 / 10; position: relative; overflow: hidden;
      background: conic-gradient(from 45deg, var(--blue) 0deg 90deg, var(--red) 90deg 180deg, var(--green) 180deg 270deg, var(--yellow) 270deg 360deg);
      border: 1px solid rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center;
    }
    .center-home::after { content: '👑'; font-size: 6cqw; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }

    /* Tokens Layer */
    .tokens-layer { position: absolute; inset: 4px; pointer-events: none; z-index: 10; }
    .token {
      position: absolute; width: 5.6%; height: 5.6%; border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: left 0.14s cubic-bezier(.25,.8,.25,1), top 0.14s cubic-bezier(.25,.8,.25,1), transform 0.14s;
      border: 2.5px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,.55), inset 0 -3px 5px rgba(0,0,0,.35);
      pointer-events: auto; cursor: default; display: flex; align-items: center; justify-content: center;
    }
    .token.fast { transition: left 0.045s linear, top 0.045s linear; }
    .token.c-0 { background: radial-gradient(circle at 35% 30%, #ff7a90, var(--red)); }
    .token.c-1 { background: radial-gradient(circle at 35% 30%, #69f0ae, var(--green)); }
    .token.c-2 { background: radial-gradient(circle at 35% 30%, #ffe57f, var(--yellow)); }
    .token.c-3 { background: radial-gradient(circle at 35% 30%, #81d4fa, var(--blue)); }
    .token.movable {
      cursor: pointer; z-index: 25;
      animation: tokenPulse 0.7s infinite alternate;
      box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 0 18px var(--me);
    }
    @keyframes tokenPulse { from { transform: translate(-50%, -50%) scale(1.05); } to { transform: translate(-50%, -50%) scale(1.28); } }

    /* Bottom Dock (Dice + Status + Chat) */
    .dock {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: var(--glass); border-top: 1px solid var(--border);
    }
    .status-text { flex: 1; font-size: .85rem; font-weight: 700; color: var(--muted); }
    .status-text strong { color: #fff; display: block; font-size: .95rem; }

    .dice-btn {
      width: 58px; height: 58px; border-radius: 16px; background: linear-gradient(145deg, #ffffff, #d9e2ec);
      color: #0f172a; font-size: 2.2rem; font-weight: 900; display: grid; place-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,.5), 0 0 0 2px var(--me); transition: .2s;
    }
    .dice-btn:disabled { opacity: .45; box-shadow: 0 4px 10px rgba(0,0,0,.3); cursor: not-allowed; }
    .dice-btn:active:not(:disabled) { transform: scale(.92); }
    .dice-btn.rolling { animation: diceSpin 0.35s ease-in-out infinite; }
    @keyframes diceSpin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.12); } 100% { transform: rotate(360deg) scale(1); } }

    .chat-open-btn { background: var(--me); color: #000; padding: 10px 16px; border-radius: 14px; font-weight: 900; font-size: .85rem; }

    /* Overlays */
    .overlay { position: fixed; inset: 0; background: rgba(8,10,16,.9); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 100; text-align: center; padding: 24px; }
    .overlay.hidden { display: none; }
    .setup-card { background: var(--glass); border: 1px solid var(--border); border-radius: 22px; padding: 24px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
    .setup-card h1 { font-size: 1.8rem; font-weight: 900; }
    .opt-label { font-size: .75rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; text-align: left; }
    .pill-row { display: flex; gap: 8px; }
