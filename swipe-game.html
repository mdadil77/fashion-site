<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Swiplay - Reaction Match</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
    body { background: #0b0d14; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* TOP NAVIGATION & ROOM INFO */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #161a2b; border-bottom: 1px solid #2d3748; }
    .back-btn { background: #2d3748; color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
    .room-info { display: flex; align-items: center; gap: 10px; }
    .room-code { background: #0b0d14; border: 1px solid #00ff66; color: #00ff66; padding: 5px 10px; border-radius: 5px; font-family: monospace; font-weight: bold; letter-spacing: 2px; }
    .share-btn { background: #00ff66; color: #000; border: none; padding: 7px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }

    /* SCOREBOARD (Top Left vs Top Right) */
    .scoreboard { display: flex; justify-content: space-between; padding: 20px 30px; font-size: 1.5rem; font-weight: 900; }
    .score-box { display: flex; flex-direction: column; align-items: center; background: #161a2b; padding: 10px 25px; border-radius: 15px; border: 1px solid #2d3748; min-width: 120px; }
    .score-box.me { border-color: #00ff66; box-shadow: 0 5px 15px rgba(0,255,102,0.15); }
    .score-box.opponent { border-color: #ff4444; box-shadow: 0 5px 15px rgba(255,68,68,0.15); }
    .score-label { font-size: 0.8rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    
    /* GAME ARENA */
    .arena { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    
    .target-box { background: #161a2b; border: 3px solid #32384a; border-radius: 20px; width: 250px; height: 250px; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.1s; }
    .target-icon { font-size: 5rem; line-height: 1; margin-bottom: 10px; }
    .target-text { font-size: 1.5rem; font-weight: bold; color: #a0aec0; }
    
    /* ANIMATIONS FOR CORRECT/WRONG */
    .correct { border-color: #00ff66 !important; background: rgba(0,255,102,0.1) !important; transform: scale(1.1); }
    .wrong { border-color: #ff4444 !important; background: rgba(255,68,68,0.1) !important; transform: translateX(-10px); animation: shake 0.2s ease-in-out 2; }
    
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-10px); }
      100% { transform: translateX(0); }
    }

    .start-btn { position: absolute; background: #00ff66; color: #000; font-size: 1.5rem; font-weight: bold; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,255,102,0.3); transition: 0.2s; z-index: 10; }
    .start-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <a href="index.html" class="back-btn">⬅ Leave</a>
    <div class="room-info">
      <div class="room-code" id="room-display">CODE: A7X9</div>
      <button class="share-btn" onclick="shareRoom()">🔗 Share</button>
    </div>
  </div>

  <!-- SCOREBOARD (As requested: Me top left, Opponent top right) -->
  <div class="scoreboard">
    <div class="score-box me">
      <div class="score-label" id="my-name">You</div>
      <div id="my-score">0</div>
    </div>
    <div class="score-box opponent">
      <div class="score-label">Opponent</div>
      <div id="opp-score">0</div>
    </div>
  </div>

  <!-- GAME ARENA -->
  <div class="arena" id="arena">
    <button class="start-btn" id="start-btn" onclick="startGame()">START MATCH</button>
    
    <div class="target-box" id="target-box" style="display: none;">
      <div class="target-icon" id="target-icon">⏳</div>
      <div class="target-text" id="target-text">Get Ready...</div>
    </div>
  </div>

  <script>
    // 1. SETUP PLAYER NAME FROM LOBBY
    window.onload = () => {
      const userData = JSON.parse(localStorage.getItem('swiplay_user'));
      if (userData && userData.name) {
        document.getElementById('my-name').innerText = userData.name;
      }
      
      // Auto-generate a random 4-letter room code
      const randomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      document.getElementById('room-display').innerText = "ROOM: " + randomCode;
    };

    function shareRoom() {
      const code = document.getElementById('room-display').innerText;
      alert(`Copied to clipboard! Send this to your friend: "Join my Swiplay room! ${code}"`);
    }

    // 2. GAME ENGINE VARIABLES
    let myScore = 0;
    let oppScore = 0;
    let isPlaying = false;
    let currentDirection = ""; // "UP", "DOWN", "LEFT", "RIGHT"
    
    const targetBox = document.getElementById('target-box');
    const targetIcon = document.getElementById('target-icon');
    const targetText = document.getElementById('target-text');

    const directions = [
      { dir: "UP", icon: "⬆️", text: "SWIPE UP" },
      { dir: "DOWN", icon: "⬇️", text: "SWIPE DOWN" },
      { dir: "LEFT", icon: "⬅️", text: "SWIPE LEFT" },
      { dir: "RIGHT", icon: "➡️", text: "SWIPE RIGHT" }
    ];

    function startGame() {
      document.getElementById('start-btn').style.display = 'none';
      targetBox.style.display = 'flex';
      myScore = 0;
      oppScore = 0;
      updateScores();
      isPlaying = true;
      
      // Simulated opponent playing (for testing UI)
      setInterval(() => {
        if(isPlaying && Math.random() > 0.6) {
          oppScore++;
          updateScores();
        }
      }, 2000);

      nextTurn();
    }

    function updateScores() {
      document.getElementById('my-score').innerText = myScore;
      document.getElementById('opp-score').innerText = oppScore;
    }

    function nextTurn() {
      if (!isPlaying) return;
      targetBox.className = "target-box"; // reset animation classes
      
      const random = directions[Math.floor(Math.random() * directions.length)];
      currentDirection = random.dir;
      targetIcon.innerText = random.icon;
      targetText.innerText = random.text;
    }

    // 3. INPUT HANDLING (Checking if swipe matches target)
    function handleInput(swipeDir) {
      if (!isPlaying || currentDirection === "") return;

      if (swipeDir === currentDirection) {
        // Correct!
        targetBox.classList.add('correct');
        myScore++;
        updateScores();
        currentDirection = ""; // Prevent double scoring
        setTimeout(nextTurn, 400); // Load next arrow quickly
      } else {
        // Wrong!
        targetBox.classList.add('wrong');
        myScore = Math.max(0, myScore - 1); // Penalty! Lose a point.
        updateScores();
        setTimeout(() => targetBox.classList.remove('wrong'), 400);
      }
    }

    // 4. TOUCH SWIPE DETECTION (For Mobile)
    let touchStartX = 0;
    let touchStartY = 0;

    document.getElementById('arena').addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    document.getElementById('arena').addEventListener('touchend', e => {
      if (!isPlaying) return;
      let touchEndX = e.changedTouches[0].screenX;
      let touchEndY = e.changedTouches[0].screenY;
      
      let diffX = touchEndX - touchStartX;
      let diffY = touchEndY - touchStartY;
      
      // Require a minimum swipe distance to prevent accidental taps
      if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return; 

      if (Math.abs(diffX) > Math.abs(diffY)) {
        handleInput(diffX > 0 ? "RIGHT" : "LEFT");
      } else {
        handleInput(diffY > 0 ? "DOWN" : "UP");
      }
    }, {passive: true});

    // 5. KEYBOARD DETECTION (For Desktop testing)
    window.addEventListener('keydown', e => {
      if (!isPlaying) return;
      if (e.key === "ArrowUp") handleInput("UP");
      if (e.key === "ArrowDown") handleInput("DOWN");
      if (e.key === "ArrowLeft") handleInput("LEFT");
      if (e.key === "ArrowRight") handleInput("RIGHT");
    });
  </script>
</body>
</html>
