<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Swiplay - Pro Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
    
    body { 
      background: radial-gradient(circle at center, #1a2035 0%, #080a10 100%); 
      color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; 
    }
    
    /* GLASSMORPHISM TOP BAR */
    .top-bar { 
      display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; 
      background: rgba(22, 26, 43, 0.4); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 50;
    }
    .back-btn { 
      background: rgba(255, 255, 255, 0.1); color: #fff; text-decoration: none; 
      padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; 
      transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .room-info { display: flex; align-items: center; gap: 12px; }
    .room-code { 
      background: rgba(0, 255, 102, 0.1); border: 1px solid #00ff66; color: #00ff66; 
      padding: 6px 15px; border-radius: 20px; font-family: monospace; font-weight: 900; 
      letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
    }
    .share-btn { 
      background: linear-gradient(135deg, #00ff66, #00cc52); color: #000; border: none; 
      padding: 8px 16px; border-radius: 20px; font-weight: 900; cursor: pointer; 
      box-shadow: 0 4px 15px rgba(0, 255, 102, 0.3); transition: 0.2s;
    }
    .share-btn:active { transform: scale(0.95); }

    /* PRO SCOREBOARD HUD */
    .scoreboard { 
      display: flex; justify-content: center; align-items: center; gap: 20px; 
      padding: 30px 20px; position: relative; z-index: 10;
    }
    .score-card { 
      display: flex; flex-direction: column; align-items: center; 
      background: rgba(22, 26, 43, 0.6); backdrop-filter: blur(12px);
      padding: 15px 30px; border-radius: 24px; min-width: 140px;
      border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.3s;
    }
    .score-card.me { border-bottom: 4px solid #00ff66; box-shadow: 0 10px 30px rgba(0, 255, 102, 0.15); }
    .score-card.opp { border-bottom: 4px solid #ff0055; box-shadow: 0 10px 30px rgba(255, 0, 85, 0.15); }
    
    .score-label { font-size: 0.85rem; color: #8f96a3; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
    .score-card.me .score-label { color: #00ff66; }
    .score-card.opp .score-label { color: #ff0055; }
    .score-value { font-size: 3rem; font-weight: 900; line-height: 1.1; margin-top: 5px; }
    
    .vs-badge {
      font-size: 1.5rem; font-weight: 900; font-style: italic; color: #fff;
      background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 50%;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    
    /* GLOWING ARENA */
    .arena { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    
    .target-box { 
      background: rgba(22, 26, 43, 0.8); backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 30px; 
      width: 260px; height: 260px; display: flex; flex-direction: column; 
      justify-content: center; align-items: center; transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 rgba(0,0,0,0);
    }
    
    /* CUSTOM SVG NEON ARROW (Replaces Emojis) */
    .arrow-vector {
      width: 120px;
      height: 120px;
      stroke: #fff;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Smooth spin physics */
      margin-bottom: 20px;
    }
    
    .target-text { font-size: 1.8rem; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
    
    /* EXTREME FEEDBACK ANIMATIONS */
    .correct { 
      border-color: #00ff66 !important; background: rgba(0, 255, 102, 0.15) !important; 
      transform: scale(1.15); box-shadow: 0 0 50px rgba(0, 255, 102, 0.4), inset 0 0 30px rgba(0, 255, 102, 0.2); 
    }
    .correct .arrow-vector { stroke: #00ff66; filter: drop-shadow(0 0 20px #00ff66); } /* Arrow turns green */

    .wrong { 
      border-color: #ff0055 !important; background: rgba(255, 0, 85, 0.15) !important; 
      box-shadow: 0 0 50px rgba(255, 0, 85, 0.4), inset 0 0 30px rgba(255, 0, 85, 0.2);
      animation: aggressiveShake 0.3s cubic-bezier(.36,.07,.19,.97) both; 
    }
    .wrong .arrow-vector { stroke: #ff0055; filter: drop-shadow(0 0 20px #ff0055); } /* Arrow turns red */
    
    @keyframes aggressiveShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-15px) rotate(-5deg); }
      40% { transform: translateX(15px) rotate(5deg); }
      60% { transform: translateX(-15px) rotate(-5deg); }
      80% { transform: translateX(15px) rotate(5deg); }
    }

    /* NEON START BUTTON */
    .start-btn { 
      position: absolute; background: linear-gradient(135deg, #00ff66, #00cc52); 
      color: #000; font-size: 1.8rem; font-weight: 900; text-transform: uppercase; 
      letter-spacing: 2px; border: none; padding: 20px 50px; border-radius: 40px; 
      cursor: pointer; box-shadow: 0 15px 35px rgba(0,255,102,0.4); 
      transition: 0.2s; z-index: 10; animation: pulse 2s infinite;
    }
    .start-btn:active { transform: scale(0.9) translateY(5px); box-shadow: 0 5px 15px rgba(0,255,102,0.4); }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(0, 255, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
    }
  </style>
</head>
<body>

  <!-- PRO TOP BAR -->
  <div class="top-bar">
    <a href="index.html" class="back-btn">⬅ Lobby</a>
    <div class="room-info">
      <div class="room-code" id="room-display">CODE: A7X9</div>
      <button class="share-btn" onclick="shareRoom()">Share</button>
    </div>
  </div>

  <!-- HUD SCOREBOARD -->
  <div class="scoreboard">
    <div class="score-card me">
      <div class="score-label" id="my-name">You</div>
      <div class="score-value" id="my-score">0</div>
    </div>
    
    <div class="vs-badge">VS</div>
    
    <div class="score-card opp">
      <div class="score-label">Opponent</div>
      <div class="score-value" id="opp-score">0</div>
    </div>
  </div>

  <!-- GLOWING ARENA -->
  <div class="arena" id="arena">
    <button class="start-btn" id="start-btn" onclick="startGame()">Fight!</button>
    
    <div class="target-box" id="target-box" style="visibility: hidden;">
      
      <!-- PURE SVG CUSTOM UI ARROW (NO MORE EMOJIS) -->
      <svg class="arrow-vector" id="arrow-vector" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <polyline points="5 11 12 4 19 11"></polyline>
      </svg>

      <div class="target-text" id="target-text">Get Ready...</div>
    </div>
  </div>

  <script>
    window.onload = () => {
      const userData = JSON.parse(localStorage.getItem('swiplay_user'));
      if (userData && userData.name) {
        document.getElementById('my-name').innerText = userData.name;
      }
      const randomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      document.getElementById('room-display').innerText = "ROOM: " + randomCode;
    };

    function shareRoom() {
      const code = document.getElementById('room-display').innerText;
      alert(`Copied to clipboard! Send this to your friend: "Join my Swiplay room! ${code}"`);
    }

    let myScore = 0;
    let oppScore = 0;
    let isPlaying = false;
    let currentDirection = ""; 
    
    const targetBox = document.getElementById('target-box');
    const arrowVector = document.getElementById('arrow-vector');
    const targetText = document.getElementById('target-text');

    // Mapped strictly to SVG Rotations instead of emojis
    const directions = [
      { dir: "UP", rotation: 0, text: "SWIPE UP" },
      { dir: "RIGHT", rotation: 90, text: "SWIPE RIGHT" },
      { dir: "DOWN", rotation: 180, text: "SWIPE DOWN" },
      { dir: "LEFT", rotation: -90, text: "SWIPE LEFT" }
    ];

    function startGame() {
      document.getElementById('start-btn').style.display = 'none';
      targetBox.style.visibility = 'visible';
      myScore = 0;
      oppScore = 0;
      updateScores();
      isPlaying = true;
      
      setInterval(() => {
        if(isPlaying && Math.random() > 0.6) {
          oppScore++;
          updateScores();
        }
      }, 2000);

      nextTurn();
    }

    function updateScores() {
      document.getElementById('my-score').innerText = myScore;
      document.getElementById('opp-score').innerText = oppScore;
    }

    function nextTurn() {
      if (!isPlaying) return;
      targetBox.className = "target-box"; // reset correct/wrong colors
      
      const random = directions[Math.floor(Math.random() * directions.length)];
      currentDirection = random.dir;
      
      // Physically rotate the SVG graphic
      arrowVector.style.transform = `rotate(${random.rotation}deg)`;
      targetText.innerText = random.text;
    }

    function handleInput(swipeDir) {
      if (!isPlaying || currentDirection === "") return;

      if (swipeDir === currentDirection) {
        targetBox.classList.add('correct');
        myScore++;
        updateScores();
        currentDirection = ""; 
        setTimeout(nextTurn, 300);
      } else {
        targetBox.classList.add('wrong');
        myScore = Math.max(0, myScore - 1); 
        updateScores();
        setTimeout(() => targetBox.classList.remove('wrong'), 300);
      }
    }

    let touchStartX = 0;
    let touchStartY = 0;
    document.getElementById('arena').addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    document.getElementById('arena').addEventListener('touchend', e => {
      if (!isPlaying) return;
      let diffX = e.changedTouches[0].screenX - touchStartX;
      let diffY = e.changedTouches[0].screenY - touchStartY;
      
      if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return; 
      if (Math.abs(diffX) > Math.abs(diffY)) {
        handleInput(diffX > 0 ? "RIGHT" : "LEFT");
      } else {
        handleInput(diffY > 0 ? "DOWN" : "UP");
      }
    }, {passive: true});

    window.addEventListener('keydown', e => {
      if (!isPlaying) return;
      if (e.key === "ArrowUp" || e.key === "w") handleInput("UP");
      if (e.key === "ArrowDown" || e.key === "s") handleInput("DOWN");
      if (e.key === "ArrowLeft" || e.key === "a") handleInput("LEFT");
      if (e.key === "ArrowRight" || e.key === "d") handleInput("RIGHT");
    });
  </script>
</body>
</html>
