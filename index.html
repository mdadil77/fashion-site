<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Swipe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; touch-action: none; }
        #score-board { position: absolute; top: 40px; font-size: 2rem; color: #00FF41; }
        #instruction { font-size: 3rem; text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #arrow { font-size: 6rem; height: 100px; }
        #timer-container { width: 80%; height: 15px; background: #333; border-radius: 10px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: #00FF41; transition: width 0.05s linear, background-color 0.2s; }
    </style>
</head>
<body>

    <div id="score-board">Score: <span id="score">0</span></div>
    
    <div id="instruction">
        <div id="arrow">⏱️</div>
        <div id="text">Tap or Click to Start</div>
    </div>

    <div id="timer-container">
        <div id="timer-bar"></div>
    </div>

    <script>
        // Game Variables
        let score = 0;
        let currentCommand = '';
        const directions = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
        const arrows = { 'UP': '⬆️', 'DOWN': '⬇️', 'LEFT': '⬅️', 'RIGHT': '➡️' };
        
        // HTML Elements
        const textEl = document.getElementById('text');
        const arrowEl = document.getElementById('arrow');
        const scoreEl = document.getElementById('score');
        const timerBar = document.getElementById('timer-bar');
        
        // Timer Variables
        let timerInterval;
        let maxTime = 2000; // Start with 2 seconds per swipe
        let timeLeft = maxTime;

        // Touch Variables
        let touchstartX = 0;
        let touchstartY = 0;
        let touchendX = 0;
        let touchendY = 0;

        function gameOver(reason) {
            clearInterval(timerInterval); // Stop the clock!
            arrowEl.innerText = '💀';
            textEl.innerHTML = `GAME OVER!<br><span style="font-size: 1.5rem; color: #ff4444;">${reason}</span>`;
            timerBar.style.width = '0%';
            score = 0;
            currentCommand = '';
            setTimeout(() => textEl.innerHTML += "<br><span style='font-size: 1.5rem; color: #aaa;'>Tap to Restart</span>", 1500);
        }

        function startTimer() {
            clearInterval(timerInterval);
            // Make the game faster for every point scored! (Minimum time: 0.6 seconds)
            maxTime = Math.max(600, 2000 - (score * 50)); 
            timeLeft = maxTime;
            
            // This loop runs every 50 milliseconds to shrink the bar smoothly
            timerInterval = setInterval(() => {
                timeLeft -= 50; 
                let percentage = (timeLeft / maxTime) * 100;
                timerBar.style.width = percentage + '%';

                // Turn the bar red if time is running out (under 30%)
                if (percentage < 30) {
                    timerBar.style.background = '#ff4444';
                } else {
                    timerBar.style.background = '#00FF41';
                }

                if (timeLeft <= 0) {
                    gameOver("Time ran out!");
                }
            }, 50);
        }

        function nextRound() {
            currentCommand = directions[Math.floor(Math.random() * directions.length)];
            arrowEl.innerText = arrows[currentCommand];
            textEl.innerText = `SWIPE ${currentCommand}!`;
            startTimer();
        }

        function checkSwipe() {
            let xDiff = touchendX - touchstartX;
            let yDiff = touchendY - touchstartY;
            let swipeDirection = '';

            // Ignore tiny accidental taps instead of counting them as swipes
            if (Math.abs(xDiff) < 30 && Math.abs(yDiff) < 30) return; 

            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                swipeDirection = xDiff > 0 ? 'RIGHT' : 'LEFT';
            } else {
                swipeDirection = yDiff > 0 ? 'DOWN' : 'UP';
            }

            if (swipeDirection === currentCommand) {
                score++;
                scoreEl.innerText = score;
                nextRound();
            } else {
                gameOver(`You swiped ${swipeDirection}`);
            }
        }

        function handleStart() {
            if(textEl.innerText.includes("Start") || textEl.innerText.includes("Restart")) {
                scoreEl.innerText = "0";
                timerBar.style.background = '#00FF41';
                nextRound();
            }
        }

        // Mobile Touches
        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
            handleStart();
        });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            if(currentCommand !== '') checkSwipe();
        });

        // Laptop Clicks & Drags
        document.addEventListener('mousedown', e => {
            touchstartX = e.clientX;
            touchstartY = e.clientY;
            handleStart();
        });

        document.addEventListener('mouseup', e => {
            touchendX = e.clientX;
            touchendY = e.clientY;
            if(currentCommand !== '') checkSwipe();
        });
    </script>
</body>
</html>
