<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Swipe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        #score-board { position: absolute; top: 20px; font-size: 2rem; color: #00FF41; }
        #instruction { font-size: 4rem; text-align: center; margin-bottom: 20px; }
        #timer-bar { width: 80%; height: 10px; background: #fff; border-radius: 5px; transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div id="score-board">Score: <span id="score">0</span></div>
    <div id="instruction">Tap to Start</div>
    <div id="timer-bar"></div>

    <script>
        // Game Variables
        let score = 0;
        let currentCommand = '';
        const directions = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
        const instructionEl = document.getElementById('instruction');
        const scoreEl = document.getElementById('score');
        
        // Touch Variables
        let touchstartX = 0;
        let touchstartY = 0;
        let touchendX = 0;
        let touchendY = 0;

        // Start the game logic
        function nextRound() {
            // Pick a random direction
            currentCommand = directions[Math.floor(Math.random() * directions.length)];
            instructionEl.innerText = `SWIPE ${currentCommand}!`;
            // In the future, we will add the timer logic here
        }

        function checkSwipe() {
            let xDiff = touchendX - touchstartX;
            let yDiff = touchendY - touchstartY;
            let swipeDirection = '';

            // Math to determine if the swipe was mostly horizontal or vertical
            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                swipeDirection = xDiff > 0 ? 'RIGHT' : 'LEFT';
            } else {
                swipeDirection = yDiff > 0 ? 'DOWN' : 'UP'; // Y goes down as numbers go up in web browsers
            }

            // Check if they matched the command
            if (swipeDirection === currentCommand) {
                score++;
                scoreEl.innerText = score;
                nextRound();
            } else {
                instructionEl.innerText = `GAME OVER! You swiped ${swipeDirection}`;
                score = 0; // Reset
                setTimeout(() => instructionEl.innerText = "Tap to Restart", 2000);
            }
        }

        // Listeners for mobile touches
        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
            
            // Start game on first tap
            if(instructionEl.innerText === "Tap to Start" || instructionEl.innerText === "Tap to Restart") {
                scoreEl.innerText = "0";
                nextRound();
            }
        });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            if(currentCommand !== '') checkSwipe();
        });
        // Listeners for laptop mouse clicks and drags
        document.addEventListener('mousedown', e => {
            touchstartX = e.clientX;
            touchstartY = e.clientY;
            
            // Start game on first click
            if(instructionEl.innerText.includes("Start") || instructionEl.innerText.includes("Restart")) {
                scoreEl.innerText = "0";
                nextRound();
            }
        });

        document.addEventListener('mouseup', e => {
            touchendX = e.clientX;
            touchendY = e.clientY;
            if(currentCommand !== '') checkSwipe();
        });
    </script>
</body>
</html>
