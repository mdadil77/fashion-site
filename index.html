<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #000; color: #fff; overflow: hidden; }
        .swiper { width: 100vw; height: 100vh; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 700; }
        .slide-1 { background: linear-gradient(45deg, #1a1a1a, #4a4a4a); }
        .slide-2 { background: linear-gradient(45deg, #001f3f, #0074D9); }
    </style>
</head>
<body>

    <div class="swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide slide-1">Premium Looks</div>
            <div class="swiper-slide slide-2">Smooth Gestures</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            direction: 'vertical', // Swipe up/down like TikTok or premium sites
            mousewheel: true,
            speed: 1000, // Smooth transition speed
        });
    </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // 1. Set the initial state (hide the text and push it down 50 pixels)
        gsap.set('.swiper-slide', { opacity: 0, y: 50 });

        // 2. Animate the first slide immediately when the page loads
        gsap.to('.slide-1', { opacity: 1, y: 0, duration: 1, ease: 'power3.out' });

        // 3. Listen for the user swiping, then animate the text
        swiper.on('slideChangeTransitionStart', function () {
            // Instantly hide all text on all slides
            gsap.to('.swiper-slide', { opacity: 0, y: 50, duration: 0.5 });
            
            // Find the slide the user just swiped to, and animate its text up smoothly
            let activeSlide = swiper.slides[swiper.activeIndex];
            gsap.to(activeSlide, { opacity: 1, y: 0, duration: 1, ease: 'power3.out', delay: 0.2 });
        });
    </script>
</body>
</html>
