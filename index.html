<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="google-site-verification" content="AsBhcQ14lhMgL6ElUHyqReRy-zcLIwM9gLCYuiirQVU" />
  
  <title>Swiplay | The Ultimate Reflex Arcade</title>
  <meta name="description" content="Test your reflexes in Swiplay! A fast-paced, brain-bending arcade game with global leaderboards. Can you survive the cognitive trap?">
  <meta name="keywords" content="swiplay, reaction game, swipe game, browser game, fun with friends, arcade, reflex trainer">
  
  <meta property="og:title" content="Swiplay - Play Now!">
  <meta property="og:description" content="I challenge you to beat my high score in Swiplay. Tap the link to play!">
  <meta property="og:url" content="https://funwithfrnds.vercel.app">
  <meta property="og:type" content="website">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
  
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background: #2A0000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; touch-action: none; transition: background 0.2s; }
    
    .screen-shake { animation: bigShake 0.4s ease; }
    @keyframes bigShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 10px); }
      40% { transform: translate(10px, -10px); }
      60% { transform: translate(-10px, -10px); }
      80% { transform: translate(10px, 10px); }
      100% { transform: translate(0, 0); }
    }

    #hud { position: absolute; top: 15px; width: 90%; display: flex; justify-content: space-between; align-items: flex-start; z-index: 20; }
    .score-box { display: flex; flex-direction: column; align-items: center; }
    #score-board { font-size: 2.2rem; color: #00FF41; text-shadow: 0 0 10px #00FF41; }
    #local-high { font-size: 0.9rem; color: #aaa; margin-top: -5px; }
    #combo-board { font-size: 1.5rem; color: #FFD700; display: none; text-shadow: 0 0 10px #FFD700; }
    
    /* Bottom Controls */
    #player-id { position: absolute; bottom: 15px; left: 15px; font-size: 0.8rem; color: #888; cursor: pointer; z-index: 20; text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s; }
    #player-id:hover { color: #fff; }
    
    /* NEW: Share Button Styling */
    #share-btn { position: absolute; bottom: 15px; right: 15px; font-size: 0.8rem; color: #00FF41; cursor: pointer; z-index: 20; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; background: rgba(0, 255, 65, 0.1); padding: 5px 10px; border-radius: 5px; border: 1px solid rgba(0, 255, 65, 0.3); transition: all 0.2s; }
    #share-btn:hover { background: rgba(0, 255, 65, 0.3); color: #fff; }

    #instruction { font-size: 2.5rem; text-align: center; margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; z-index: 10; }
    #arrow { font-size: 7rem; height: 100px; line-height: 100px; color: #ffffff; text-shadow: 0 0 10px #ffffff, 0 0 30px #ffffff; font-weight: 900; z-index: 10; transition: color 0.2s, text-shadow 0.2s; }

    #timer-container { width: 80%; height: 15px; background: #1a0000; border-radius: 10px; overflow: hidden; margin-top: 30px; box-shadow: 0 0 10px #000; z-index: 10; border: 1px solid #333; }
    #timer-bar { width: 100%; height: 100%; background: #00FF41; transition: width 0.05s linear, background-color 0.2s ease; }
    .freeze-anim { background: #00FFFF !important; box-shadow: 0 0 15px #00FFFF; }

    #leaderboard { font-size: 1rem; color: #ccc; margin-top: 25px; text-align: center; width: 85%; border-top: 2px solid #550000; padding-top: 15px; z-index: 10; }
    .legend-item { margin: 6px 0; font-size: 1.1rem; background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .rank { color: #888; font-size: 0.9rem; width: 25px; text-align: right; }
    .avatar { font-size: 1.2rem; }

    .float-pt { position: absolute; color: #00FF41; font-size: 2rem; font-weight: bold; pointer-events: none; animation: floatUp 0.6s ease-out forwards; z-index: 50; text-shadow: 0 0 10px #000; }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.5); } }

    .correct-anim { animation: pulse 0.3s ease; }
    .wrong-anim { animation: shake 0.4s ease; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    @keyframes shake { 0% { transform: translateX(0); color: #ff4444; } 25% { transform: translateX(-15px); } 50% { transform: translateX(15px); } 75% { transform: translateX(-15px); } 100% { transform: translateX(0); color: #ff4444; } }
  </style>
</head>
<body>

  <div id="hud">
    <div class="score-box">
      <div id="score-board"><span id="score">0</span></div>
      <div id="local-high">Best: <span id="best-score">0</span></div>
    </div>
    <div id="combo-board">COMBO x<span id="combo">0</span></div>
  </div>

  <div id="instruction">
    <div id="arrow">▶</div>
    <div id="text">Tap to Play Swiplay</div>
  </div>
  
  <div id="timer-container"><div id="timer-bar"></div></div>
  <div id="leaderboard">Loading Swiplay Network...</div>
  
  <div id="player-id" onclick="changeName()">👤 Identify Yourself</div>
  <div id="share-btn" onclick="shareGame()">🔗 Invite Friend</div>

  <audio id="sound-correct" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
  <audio id="sound-wrong" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
  <audio id="sound-milestone" src="https://actions.google.com/sounds/v1/cartoon/magic_chime_chord.ogg"></audio>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDfC30PXcNaSi2o8RMwza8EoaPdyK069AM",
      authDomain: "swipegameleaderboard.firebaseapp.com",
      databaseURL: "https://swipegameleaderboard-default-rtdb.firebaseio.com",
      projectId: "swipegameleaderboard",
      storageBucket: "swipegameleaderboard.firebasestorage.app",
      messagingSenderId: "751175472721",
      appId: "1:751175472721:web:4544195a2dbea5cd948a70",
      measurementId: "G-8TK6JZDQ2N"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let score = 0, combo = 0, currentCommand = '', timerInterval, maxTime = 2000, timeLeft = maxTime;
    let isFrozen = false;
    let isReverse = false; 
    
    let localHigh = localStorage.getItem('arcadeBest') || 0;
    document.getElementById('best-score').innerText = localHigh;
    let savedPlayerName = localStorage.getItem('arcadePlayerName');
    let savedPlayerAvatar = localStorage.getItem('arcadePlayerAvatar');
    
    if (savedPlayerName) {
        document.getElementById('player-id').innerText = `${savedPlayerAvatar} ${savedPlayerName} (Tap to change)`;
    }

    const directions = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
    const arrows = { 'UP': '↑', 'DOWN': '↓', 'LEFT': '←', 'RIGHT': '→' };
    const opposites = { 'UP': 'DOWN', 'DOWN': 'UP', 'LEFT': 'RIGHT', 'RIGHT': 'LEFT' }; 
    const bgColors = { 'UP': '#1A2A3A', 'DOWN': '#3A1A3A', 'LEFT': '#3A3A1A', 'RIGHT': '#1A3A2A' };
    const avatarsList = ['🦊', '👾', '🚀', '🔥', '🐉', '⚡', '🤖', '💀', '👽', '😎', '👑', '🦁', '🕹️'];

    const textEl = document.getElementById('text'), arrowEl = document.getElementById('arrow'), scoreEl = document.getElementById('score'), timerBar = document.getElementById('timer-bar'), leaderboardEl = document.getElementById('leaderboard'), comboBoard = document.getElementById('combo-board'), comboEl = document.getElementById('combo');
    const soundCorrect = document.getElementById('sound-correct'), soundWrong = document.getElementById('sound-wrong'), soundMilestone = document.getElementById('sound-milestone');

    function updateLeaderboard() {
      database.ref('scores').on('value', snapshot => {
        let html = '<div style="color:#FFD700; margin-bottom:10px; font-weight:900; text-shadow: 0 0 5px #000; letter-spacing: 1px;">🏆 SWIPLAY TOP 10 🏆</div>';
        if (!snapshot.exists()) { leaderboardEl.innerHTML = html + '<div style="color:#888;">No scores yet!</div>'; return; }
        
        let bestScores = {};
        snapshot.forEach(child => {
          let data = child.val();
          if (data && typeof data.score === 'number' && data.score > 0 && data.name) {
            let playerName = data.name.trim();
            if (!bestScores[playerName] || data.score > bestScores[playerName].score) { bestScores[playerName] = data; }
          }
        });
        
        let list = Object.values(bestScores);
        list.sort((a, b) => b.score - a.score);
        let top10 = list.slice(0, 10);
        
        top10.forEach((user, index) => {
          let nameColor = index === 0 ? "#FFD700" : "#00FF41";
          let av = user.avatar || '👤';
          html += `<div class="legend-item">
                     <span class="rank">#${index + 1}</span> 
                     <span class="avatar">${av}</span>
                     <span style="color:${nameColor}; font-weight:bold;">${user.name}</span>
                     <span style="color:#fff; margin-left:auto;">${user.score} pts</span>
                   </div>`;
        });
        leaderboardEl.innerHTML = html;
      });
    }
    updateLeaderboard();

    function triggerConfetti() { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, zIndex: 100 }); }

    function spawnFloatingPoint(x, y) {
        let pt = document.createElement('div');
        pt.className = 'float-pt';
        pt.innerText = '+1';
        pt.style.left = (x - 20) + 'px'; pt.style.top = (y - 20) + 'px';
        document.body.appendChild(pt);
        setTimeout(() => pt.remove(), 600);
    }

    function changeName() {
        let newName = prompt("Enter your Swiplay username:", savedPlayerName || "Player");
        if (newName) {
            savedPlayerName = newName.substring(0, 10);
            savedPlayerAvatar = avatarsList[Math.floor(Math.random() * avatarsList.length)];
            localStorage.setItem('arcadePlayerName', savedPlayerName);
            localStorage.setItem('arcadePlayerAvatar', savedPlayerAvatar);
            document.getElementById('player-id').innerText = `${savedPlayerAvatar} ${savedPlayerName} (Tap to change)`;
        }
    }

    // NEW: The Viral Share Function
    function shareGame() {
        // Stop the game if they click share while playing
        if(currentCommand) { clearInterval(timerInterval); score = 0; currentCommand = ''; timerBar.style.width = "0%"; textEl.innerText = "Tap to Play Swiplay"; arrowEl.innerText = '▶'; }
        
        let shareText = localHigh > 0 
            ? `I just scored ${localHigh} points on Swiplay! 🕹️ Think your reflexes are faster than mine?` 
            : `Check out Swiplay, a fast-paced reflex arcade game! 🕹️ Can you beat the global high score?`;
            
        let shareData = {
            title: 'Swiplay Reflex Arcade',
            text: shareText,
            url: 'https://funwithfrnds.vercel.app'
        };

        // Try to open the native phone share menu
        if (navigator.share) {
            navigator.share(shareData).catch((err) => console.log('Error sharing:', err));
        } else {
            // If they are on a computer that doesn't support the share menu, copy the link instead
            navigator.clipboard.writeText(`${shareData.text} Play here: ${shareData.url}`).then(() => {
                alert("Game link copied to clipboard! Paste it to your friends.");
            });
        }
    }

    function gameOver(reason) {
      clearInterval(timerInterval);
      let finalScore = score;
      
      document.body.style.background = '#2A0000';
      comboBoard.style.display = 'none';
      combo = 0; isReverse = false; 

      if(finalScore > localHigh) {
        localHigh = finalScore;
        localStorage.setItem('arcadeBest', localHigh);
        document.getElementById('best-score').innerText = localHigh;
      }

      arrowEl.classList.remove('wrong-anim', 'correct-anim');
      document.body.classList.remove('screen-shake');
      void arrowEl.offsetWidth; 
      
      arrowEl.classList.add('wrong-anim');
      document.body.classList.add('screen-shake');
      soundWrong.currentTime = 0;
      soundWrong.play().catch(e => console.log(e));

      setTimeout(() => {
        if (!savedPlayerName && finalScore > 0) changeName(); 
        if (savedPlayerName && finalScore > 0) database.ref('scores').push({ name: savedPlayerName, score: finalScore, avatar: savedPlayerAvatar });
      }, 400); 
      
      textEl.innerHTML = `Game Over!<br><span style='font-size:1.5rem; color:#ff4444;'>${reason}</span><br><span style='font-size:1.2rem; color:#aaa; margin-top:10px; display:block;'>Tap to Restart</span>`;
      arrowEl.innerText = '✖'; arrowEl.style.color = "#ff4444"; arrowEl.style.textShadow = "0 0 10px #ff0000, 0 0 30px #ff0000";
      score = 0; currentCommand = ''; timerBar.style.width = "0%";
    }

    function startTimer() {
      clearInterval(timerInterval);
      maxTime = Math.max(500, 2000 - (score * 50));
      timeLeft = maxTime;
      
      timerInterval = setInterval(() => {
        if(isFrozen) return; 
        timeLeft -= 50;
        let percentage = (timeLeft / maxTime) * 100;
        timerBar.style.width = percentage + '%';
        
        if (percentage > 50) timerBar.style.background = '#00FF41'; 
        else if (percentage > 25) timerBar.style.background = '#FFD700'; 
        else timerBar.style.background = '#FF0000'; 
        
        if (timeLeft <= 0) gameOver("Time ran out!");
      }, 50);
    }

    function nextRound() {
      currentCommand = directions[Math.floor(Math.random() * directions.length)];
      arrowEl.innerText = arrows[currentCommand];
      isReverse = Math.random() < 0.2; 
      
      if (isReverse) {
          arrowEl.style.color = "#FF00FF"; arrowEl.style.textShadow = "0 0 20px #FF00FF, 0 0 40px #FF00FF";
          textEl.innerText = `SWIPE OPPOSITE!`; textEl.style.color = "#FF00FF"; document.body.style.background = "#200020"; 
      } else {
          arrowEl.style.color = "#ffffff"; arrowEl.style.textShadow = "0 0 10px #ffffff, 0 0 30px #ffffff";
          textEl.innerText = `SWIPE ${currentCommand}!`; textEl.style.color = "#ffffff"; document.body.style.background = bgColors[currentCommand];
      }
      startTimer();
    }

    function checkSwipe(dir, touchX, touchY) {
      let requiredSwipe = isReverse ? opposites[currentCommand] : currentCommand;

      if (dir === requiredSwipe) { 
        score++; combo++; scoreEl.innerText = score; 
        spawnFloatingPoint(touchX, touchY); 
        
        arrowEl.classList.remove('correct-anim', 'wrong-anim'); document.body.classList.remove('screen-shake'); void arrowEl.offsetWidth; 
        arrowEl.classList.add('correct-anim');
        soundCorrect.currentTime = 0; soundCorrect.play().catch(e => console.log(e));

        if (combo >= 5) { comboBoard.style.display = 'block'; comboEl.innerText = combo; }
        if (combo % 15 === 0) { 
            isFrozen = true; timerBar.classList.add('freeze-anim'); soundMilestone.play().catch(e=>console.log(e)); triggerConfetti();
            setTimeout(() => { isFrozen = false; timerBar.classList.remove('freeze-anim'); }, 2000);
        }
        nextRound(); 
      } else {
          let mistakeMessage = isReverse ? `Trap! You swiped ${dir}` : `You swiped ${dir}`;
          gameOver(mistakeMessage);
      }
    }

    // Input Handling
    function handleStart(e) {
        // Prevent starting the game if clicking the bottom buttons
        if (e.target.id === 'player-id' || e.target.id === 'share-btn') return;
        if (!currentCommand) { scoreEl.innerText = "0"; arrowEl.classList.remove('wrong-anim'); document.body.classList.remove('screen-shake'); nextRound(); } 
    }

    let tsX, tsY;
    document.addEventListener('mousedown', e => { tsX = e.clientX; tsY = e.clientY; handleStart(e); });
    document.addEventListener('mouseup', e => {
      if (e.target.id === 'player-id' || e.target.id === 'share-btn') return;
      let x = e.clientX - tsX, y = e.clientY - tsY;
      if (Math.abs(x) > 30 || Math.abs(y) > 30) checkSwipe(Math.abs(x) > Math.abs(y) ? (x > 0 ? 'RIGHT' : 'LEFT') : (y > 0 ? 'DOWN' : 'UP'), e.clientX, e.clientY);
    });

    document.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; handleStart(e); });
    document.addEventListener('touchend', e => {
      if (e.target.id === 'player-id' || e.target.id === 'share-btn') return;
      let x = e.changedTouches[0].clientX - tsX, y = e.changedTouches[0].clientY - tsY;
      let touchEndObj = e.changedTouches[0];
      if (Math.abs(x) > 30 || Math.abs(y) > 30) checkSwipe(Math.abs(x) > Math.abs(y) ? (x > 0 ? 'RIGHT' : 'LEFT') : (y > 0 ? 'DOWN' : 'UP'), touchEndObj.clientX, touchEndObj.clientY);
    });
  </script>
</body>
</html>
