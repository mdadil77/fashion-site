<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Swipe - Arcade Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background: #2A0000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; touch-action: none; }

    #score-board { position: absolute; top: 20px; font-size: 1.8rem; color: #00FF41; }
    #instruction { font-size: 2.5rem; text-align: center; margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; }

    #arrow { font-size: 7rem; height: 100px; line-height: 100px; color: #ffffff; text-shadow: 0 0 10px #ff0000, 0 0 30px #ff0000, 0 0 50px #ff0000; font-weight: 900; }

    #timer-container { width: 80%; height: 12px; background: #1a0000; border-radius: 10px; overflow: hidden; margin-top: 20px; box-shadow: 0 0 10px #000; }
    #timer-bar { width: 100%; height: 100%; background: #00FF41; transition: width 0.05s linear; }

    #leaderboard { font-size: 1rem; color: #ccc; margin-top: 25px; text-align: center; width: 85%; border-top: 2px solid #550000; padding-top: 15px; }
    .legend-item { margin: 6px 0; font-size: 1.1rem; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 5px; }
    .rank { color: #888; font-size: 0.9rem; margin-right: 5px; }

    /* Animations */
    .correct-anim { animation: pulse 0.3s ease; }
    .wrong-anim { animation: shake 0.4s ease; }

    @keyframes pulse {
      0% { transform: scale(1); color: #00FF41; text-shadow: 0 0 20px #00FF41; }
      50% { transform: scale(1.3); color: #00ffcc; text-shadow: 0 0 40px #00ffcc; }
      100% { transform: scale(1); color: #ffffff; text-shadow: 0 0 10px #ff0000, 0 0 30px #ff0000; }
    }

    @keyframes shake {
      0% { transform: translateX(0); color: #ff4444; }
      25% { transform: translateX(-15px); }
      50% { transform: translateX(15px); }
      75% { transform: translateX(-15px); }
      100% { transform: translateX(0); color: #ff4444; }
    }
  </style>
</head>
<body>

  <div id="score-board">Score: <span id="score">0</span></div>
  <div id="instruction">
    <div id="arrow">▶</div>
    <div id="text">Tap or Click to Start</div>
  </div>
  <div id="timer-container"><div id="timer-bar"></div></div>
  <div id="leaderboard">Loading Global Leaderboard...</div>

  <audio id="sound-correct" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
  <audio id="sound-wrong" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDfC30PXcNaSi2o8RMwza8EoaPdyK069AM",
      authDomain: "swipegameleaderboard.firebaseapp.com",
      databaseURL: "https://swipegameleaderboard-default-rtdb.firebaseio.com",
      projectId: "swipegameleaderboard",
      storageBucket: "swipegameleaderboard.firebasestorage.app",
      messagingSenderId: "751175472721",
      appId: "1:751175472721:web:4544195a2dbea5cd948a70",
      measurementId: "G-8TK6JZDQ2N"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let score = 0, currentCommand = '', timerInterval, maxTime = 2000, timeLeft = maxTime;
    const directions = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
    const arrows = { 'UP': '↑', 'DOWN': '↓', 'LEFT': '←', 'RIGHT': '→' };

    const textEl = document.getElementById('text'),
          arrowEl = document.getElementById('arrow'),
          scoreEl = document.getElementById('score'),
          timerBar = document.getElementById('timer-bar'),
          leaderboardEl = document.getElementById('leaderboard');

    const soundCorrect = document.getElementById('sound-correct');
    const soundWrong = document.getElementById('sound-wrong');

    function updateLeaderboard() {
      database.ref('scores').on('value', snapshot => {
        let html = '<div style="color:#FFD700; margin-bottom:10px; font-weight:900; text-shadow: 0 0 5px #000;">🏆 TOP 10 LEGENDS 🏆</div>';
        if (!snapshot.exists()) {
          leaderboardEl.innerHTML = html + '<div style="color:#888;">No scores yet!</div>';
          return;
        }
        let bestScores = {};
        snapshot.forEach(child => {
          let data = child.val();
          if (data && typeof data.score === 'number' && data.score > 0 && data.name) {
            let playerName = data.name.trim();
            if (!bestScores[playerName] || data.score > bestScores[playerName].score) {
              bestScores[playerName] = data;
            }
          }
        });
        let list = Object.values(bestScores);
        list.sort((a, b) => b.score - a.score);
        let top10 = list.slice(0, 10);
        top10.forEach((user, index) => {
          let nameColor = index === 0 ? "#FFD700" : "#00FF41";
          html += `<div class="legend-item"><span class="rank">#${index + 1}</span> 
                   <span style="color:${nameColor}; font-weight:bold;">${user.name}</span>: 
                   <span style="color:#fff; margin-left:5px;">${user.score} pts</span></div>`;
        });
        leaderboardEl.innerHTML = html;
      });
    }
    updateLeaderboard();

    function gameOver(reason) {
      clearInterval(timerInterval);
      
      // THE FIX: We take a snapshot of the score right now before anything else happens!
      let finalScore = score;
      
      arrowEl.classList.remove('wrong-anim', 'correct-anim');
      void arrowEl.offsetWidth; 
      arrowEl.classList.add('wrong-anim');
      soundWrong.currentTime = 0;
      soundWrong.play().catch(e => console.log(e));

      setTimeout(() => {
        // We use finalScore here instead of score!
        let name = prompt(`GAME OVER! ${reason}. Score: ${finalScore}\nEnter name for the list:`, "Player");
        if(name && finalScore > 0) {
          database.ref('scores').push({ name: name.substring(0, 10), score: finalScore });
        }
      }, 400); 
      
      textEl.innerHTML = `Game Over!<br><span style='font-size:1.5rem; color:#ff4444;'>${reason}</span><br><span style='font-size:1.2rem; color:#aaa; margin-top:10px; display:block;'>Tap to Restart</span>`;
      arrowEl.innerText = '✖'; 
      arrowEl.style.color = "#ff4444";
      
      // Reset the main score for the next game
      score = 0; 
      currentCommand = ''; timerBar.style.width = "0%";
    }

    function startTimer() {
      clearInterval(timerInterval);
      maxTime = Math.max(600, 2000 - (score * 65));
      timeLeft = maxTime;
      timerInterval = setInterval(() => {
        timeLeft -= 50;
        timerBar.style.width = (timeLeft / maxTime) * 100 + '%';
        if (timeLeft <= 0) gameOver("Time ran out!");
      }, 50);
    }

    function nextRound() {
      currentCommand = directions[Math.floor(Math.random() * directions.length)];
      arrowEl.innerText = arrows[currentCommand];
      arrowEl.style.color = "#ffffff";
      textEl.innerText = `SWIPE ${currentCommand}!`;
      startTimer();
    }

    function checkSwipe(dir) {
      if (dir === currentCommand) { 
        score++; 
        scoreEl.innerText = score; 
        
        arrowEl.classList.remove('correct-anim', 'wrong-anim');
        void arrowEl.offsetWidth; 
        arrowEl.classList.add('correct-anim');
        soundCorrect.currentTime = 0;
        soundCorrect.play().catch(e => console.log(e));

        nextRound(); 
      }
      else gameOver(`You swiped ${dir}`);
    }

    let tsX, tsY;
    function handleStart() { if(!currentCommand) { scoreEl.innerText = "0"; arrowEl.classList.remove('wrong-anim'); nextRound(); } }

    document.addEventListener('mousedown', e => { tsX = e.clientX; tsY = e.clientY; handleStart(); });
    document.addEventListener('mouseup', e => {
      let x = e.clientX - tsX, y = e.clientY - tsY;
      if (Math.abs(x) > 30 || Math.abs(y) > 30) checkSwipe(Math.abs(x) > Math.abs(y) ? (x > 0 ? 'RIGHT' : 'LEFT') : (y > 0 ? 'DOWN' : 'UP'));
    });

    document.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; handleStart(); });
    document.addEventListener('touchend', e => {
      let x = e.changedTouches[0].clientX - tsX, y = e.changedTouches[0].clientY - tsY;
      if (Math.abs(x) > 30 || Math.abs(y) > 30) checkSwipe(Math.abs(x) > Math.abs(y) ? (x > 0 ? 'RIGHT' : 'LEFT') : (y > 0 ? 'DOWN' : 'UP'));
    });
  </script>
</body>
</html>
