<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chess — SwiPlay</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root {
    --bg: #12161c; --panel: #1b2129; --border: #2c3542;
    --text: #e8ecf1; --muted: #8b97a7; --accent: #4f8cff;
    --light-sq: #ebecd0; --dark-sq: #779556;
    --sel: rgba(255, 255, 0, .45); --last: rgba(80, 140, 255, .4);
    --check: rgba(255, 60, 60, .55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; }
  h1 { font-size: 1.3rem; margin-bottom: 10px; }
  #mode-bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
  #mode-bar button, .btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: .85rem; }
  #mode-bar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #layout { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  #board-col { display: flex; flex-direction: column; gap: 6px; }
  .player-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; width: min(90vw, 480px); }
  .clock { font-variant-numeric: tabular-nums; font-size: 1.15rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .clock.running { background: var(--accent); color: #fff; }
  .clock.low { background: #c0392b; color: #fff; }
  #board { position: relative; width: min(90vw, 480px); aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border: 2px solid var(--border); border-radius: 4px; overflow: hidden; user-select: none; touch-action: manipulation; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; font-size: clamp(28px, 8.5vw, 46px); cursor: pointer; }
  .sq.light { background: var(--light-sq); } .sq.dark { background: var(--dark-sq); }
  .sq.sel::after, .sq.last::after { content: ''; position: absolute; inset: 0; }
  .sq.sel::after { background: var(--sel); } .sq.last::after { background: var(--last); }
  .sq.check::after { background: var(--check); }
  .sq .dot { position: absolute; width: 26%; height: 26%; border-radius: 50%; background: rgba(20, 20, 20, .28); pointer-events: none; }
  .sq .ring { position: absolute; inset: 4%; border-radius: 50%; border: 4px solid rgba(20, 20, 20, .28); pointer-events: none; }
  .piece { line-height: 1; z-index: 1; }
  .piece.w { color: #fff; text-shadow: 0 0 3px #000, 0 1px 2px #000; }
  .piece.b { color: #111; text-shadow: 0 0 2px #ddd; }
  #side { width: min(90vw, 300px); display: flex; flex-direction: column; gap: 10px; }
  #status { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; min-height: 44px; font-size: .95rem; }
  #moves { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; height: 220px; overflow-y: auto; font-size: .85rem; line-height: 1.6; font-family: ui-monospace, monospace; }
  #controls { display: flex; gap: 6px; flex-wrap: wrap; }
  #bot-difficulty { display: none; gap: 6px; }
  #bot-difficulty.show { display: flex; }
  #promotion { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  #promotion.show { display: flex; }
  #promotion .choices { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; gap: 8px; }
  #promotion .choices span { font-size: 44px; cursor: pointer; padding: 4px 10px; border-radius: 8px; }
  #promotion .choices span:hover { background: var(--border); }
</style>
</head>
<body>
<h1>♞ Chess</h1>

<div id="mode-bar">
  <button data-mode="random">Play Random</button>
  <button data-mode="friend">Play with Friend</button>
  <button data-mode="offline">Play Offline</button>
  <button data-mode="bot">Play vs Bot</button>
  <span id="bot-difficulty">
    <button data-diff="normal" class="diff active">Normal</button>
    <button data-diff="hard" class="diff">Hard</button>
    <button data-diff="extreme" class="diff">Extreme</button>
  </span>
</div>

<div id="layout">
  <div id="board-col">
    <div class="player-bar"><span id="top-name">Black</span><span id="clock-top" class="clock">3:00</span></div>
    <div id="board"></div>
    <div class="player-bar"><span id="bottom-name">White</span><span id="clock-bottom" class="clock">3:00</span></div>
  </div>
  <div id="side">
    <div id="status">Choose a mode to start.</div>
    <div id="moves"></div>
    <div id="controls">
      <button class="btn" id="btn-new">New Game</button>
      <button class="btn" id="btn-resign">Resign</button>
      <button class="btn" id="btn-flip">Flip</button>
    </div>
  </div>
</div>

<div id="promotion"><div class="choices" id="promo-choices"></div></div>

<script type="module">
import { Chess } from 'https://esm.sh/chess.js@1.4.0'; // v1 — same as server

/* ---------- state ---------- */
const game = new Chess();
const W3_2 = { base: 180000, inc: 2000 };          // 3+2 blitz in ms
const S = {
  mode: null,            // random | friend | offline | bot
  difficulty: 'normal',
  myColor: 'w',          // human color in bot/online games
  flipped: false,
  clocks: { w: W3_2.base, b: W3_2.base },
  timerId: null, lastTick: 0,
  selected: null, legalCache: [], gameOver: false, pendingPromo: null,
};
const $ = s => document.querySelector(s);
const boardEl = $('#board'), statusEl = $('#status'), movesEl = $('#moves');
const GLYPH = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
const VAL   = { p:100, n:320, b:330, r:500, q:900, k:20000 };

/* ---------- rendering ---------- */
function render() {
  boardEl.innerHTML = '';
  const files = 'abcdefgh'.split('');
  const ranks = [8,7,6,5,4,3,2,1], last = game.history({ verbose: true }).at(-1);
  const checkSq = findCheckSq();
  for (const r of (S.flipped ? [...ranks].reverse() : ranks)) {
    for (const f of (S.flipped ? [...files].reverse() : files)) {
      const sq = f + r, div = document.createElement('div');
      div.className = 'sq ' + ((f.charCodeAt(0) + r) % 2 ? 'dark' : 'light');
      div.dataset.sq = sq;
      if (last && (last.from === sq || last.to === sq)) div.classList.add('last');
      if (S.selected === sq) div.classList.add('sel');
      if (sq === checkSq) div.classList.add('check');
      const piece = game.get(sq);
      if (piece) {
        const sp = document.createElement('span');
        sp.className = 'piece ' + piece.color;
        sp.textContent = GLYPH[piece.type];
        div.appendChild(sp);
      }
      if (S.selected) {
        const mv = S.legalCache.find(m => m.to === sq);
        if (mv) { const d = document.createElement('span'); d.className = piece ? 'ring' : 'dot'; div.appendChild(d); }
      }
      boardEl.appendChild(div);
    }
  }
}
function findCheckSq() {
  if (!game.inCheck()) return null;
  const turn = game.turn();
  for (const row of game.board()) for (const c of row)
    if (c && c.type === 'k' && c.color === turn) return c.square;
  return null;
}
function updateNames() {
  const bottom = S.flipped ? opp(S.myColor) : S.myColor;
  $('#bottom-name').textContent = bottom === 'w' ? 'White' : 'Black';
  $('#top-name').textContent = opp(bottom) === 'w' ? 'White' : 'Black';
}
const opp = c => c === 'w' ? 'b' : 'w';

/* ---------- clocks (3+2, only online/bot modes) ---------- */
function useClocks() { return S.mode === 'random' || S.mode === 'friend' || S.mode === 'bot'; }
function fmt(ms) {
  ms = Math.max(0, ms);
  const s = ms / 1000;
  return s >= 60 ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : s.toFixed(1);
}
function startTicking() {
  stopTicking();
  if (!useClocks() || S.gameOver) return;
  S.lastTick = performance.now();
  S.timerId = setInterval(() => {
    const now = performance.now(), turn = game.turn();
    S.clocks[turn] -= now - S.lastTick; S.lastTick = now;
    if (S.clocks[turn] <= 0) { S.clocks[turn] = 0; endGame(`${opp(turn) === 'w' ? 'White' : 'Black'} wins on time`, false); }
    paintClocks();
  }, 100);
  paintClocks();
}
function stopTicking() { if (S.timerId) clearInterval(S.timerId); S.timerId = null; }
function paintClocks() {
  const top = S.flipped ? S.myColor : opp(S.myColor), bot = opp(top);
  const ct = $('#clock-top'), cb = $('#clock-bottom');
  ct.textContent = fmt(S.clocks[top]); cb.textContent = fmt(S.clocks[bot]);
  ct.className = 'clock' + (!S.gameOver && game.turn() === top ? ' running' : '') + (S.clocks[top] < 20000 ? ' low' : '');
  cb.className = 'clock' + (!S.gameOver && game.turn() === bot ? ' running' : '') + (S.clocks[bot] < 20000 ? ' low' : '');
}

/* ---------- moves ---------- */
boardEl.addEventListener('click', e => {
  const sq = e.target.closest('.sq')?.dataset.sq;
  if (!sq || S.gameOver) return;
  if (S.pendingPromo) return;
  if (S.mode === 'bot' && game.turn() !== S.myColor) return;
  const piece = game.get(sq);
  if (S.selected) {
    const mv = S.legalCache.find(m => m.to === sq);
    if (mv) {
      if (mv.promotion) { askPromotion(game.turn(), from => doMove({ from: S.selected, to: sq, promotion: from })); S.selected = null; render(); return; }
      doMove({ from: S.selected, to: sq }); return;
    }
    S.selected = null;
  }
  if (piece && piece.color === game.turn()) {
    S.selected = sq;
    S.legalCache = game.moves({ square: sq, verbose: true });
  }
  render();
});
function doMove(moveObj) {
  let mv;
  try { mv = game.move(moveObj); } catch { S.selected = null; render(); return; }
  S.selected = null; S.legalCache = [];
  if (useClocks()) { S.clocks[mv.color] += W3_2.inc; }   // increment for the player who moved
  pushMoveList(mv);
  render(); paintClocks();
  checkEnd();
  if (!S.gameOver && S.mode === 'bot' && game.turn() !== S.myColor) setTimeout(botMove, 300);
}
function pushMoveList(mv) {
  const n = Math.ceil(game.history().length / 2);
  let txt = movesEl.textContent.replace(/\d+\.\s*$/, m => m);
  if (mv.color === 'w') movesEl.textContent += (movesEl.textContent && !/\n$/.test(movesEl.textContent) ? '' : '') + `${n}. `;
  movesEl.textContent += mv.san + ' ';
  movesEl.scrollTop = movesEl.scrollHeight;
}
function askPromotion(color, cb) {
  S.pendingPromo = cb;
  const box = $('#promo-choices'); box.innerHTML = '';
  for (const p of ['q','r','b','n']) {
    const el = document.createElement('span');
    el.textContent = GLYPH[p]; el.style.color = color === 'w' ? '#fff' : '#111';
    el.onclick = () => { $('#promotion').classList.remove('show'); S.pendingPromo = null; cb(p); };
    box.appendChild(el);
  }
  $('#promotion').classList.add('show');
}

/* ---------- endgame ---------- */
function checkEnd() {
  if (game.isCheckmate()) endGame(`Checkmate — ${game.turn() === 'w' ? 'Black' : 'White'} wins`, true);
  else if (game.isStalemate()) endGame('Draw — stalemate', true);
  else if (game.isThreefoldRepetition()) endGame('Draw — threefold repetition', true);
  else if (game.isInsufficientMaterial()) endGame('Draw — insufficient material', true);
  else if (game.isDraw()) endGame('Draw', true);
  else statusEl.textContent = game.inCheck() ? `${game.turn
