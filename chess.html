<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080a10">
  <title>Swiplay - Pro Chess Arena</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- Sockets and Chess Logic -->
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    const SERVER_URL = 'https://swiplay-server.onrender.com';
  </script>

  <style>
    :root {
      --bg1: #1a2035; --bg2: #080a10;
      --glass: rgba(22, 26, 43, 0.6); --glass-light: rgba(255, 255, 255, 0.1);
      --me: #00ff66; --opp: #ff0055; --gold: #ffcc00; --muted: #8f96a3;
      --board-light: #b0bacf; --board-dark: #5e6a85;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; user-select: none; }
    html, body { height: 100%; height: 100dvh; background: radial-gradient(circle at center, var(--bg1) 0%, var(--bg2) 100%); color: #fff; overflow: hidden; display: flex; flex-direction: column; }

    /* TOP BAR */
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px; background: rgba(22,26,43,.4); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.05); z-index: 50; }
    .btn-ghost { background: var(--glass-light); color: #fff; text-decoration: none; border: 1px solid var(--glass-light); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: .85rem; cursor: pointer; transition: .2s; }
    .btn-ghost:hover { background: rgba(255,255,255,.2); }
    .btn-primary { background: var(--me); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,255,102,0.3); }
    .btn-primary:active { transform: scale(0.95); }
    .room-info { display: flex; align-items: center; gap: 8px; }
    .room-code { background: rgba(0,255,102,.1); border: 1px solid var(--me); color: var(--me); padding: 6px 12px; border-radius: 20px; font-family: monospace; font-weight: 900; letter-spacing: 2px; font-size: .85rem; }
    .conn-status { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; display: none; }
    .conn-status.online { background: var(--me); box-shadow: 0 0 8px var(--me); display: inline-block; }
    .conn-status.offline { background: var(--opp); box-shadow: 0 0 8px var(--opp); display: inline-block; }

    /* SCOREBOARD / TIMERS */
    .scoreboard { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; width: 100%; max-width: 500px; margin: 0 auto; }
    .score-card { display: flex; align-items: center; gap: 12px; background: var(--glass); backdrop-filter: blur(12px); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,.05); min-width: 140px; }
    .score-card.me { border-bottom: 3px solid var(--me); box-shadow: 0 5px 20px rgba(0,255,102,0.1); flex-direction: row; }
    .score-card.opp { border-bottom: 3px solid var(--opp); box-shadow: 0 5px 20px rgba(255,0,85,0.1); flex-direction: row-reverse; text-align: right; }
    .score-card.active-turn { background: rgba(255,255,255,0.1); border-color: var(--gold); }
    .player-details { display: flex; flex-direction: column; }
    .player-name { font-size: 0.85rem; font-weight: 800; max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timer-display { font-size: 1.2rem; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
    .timer-display.danger { color: var(--opp); animation: pulse 1s infinite alternate; }

    @keyframes pulse { to { transform: scale(1.05); } }

    /* ARENA & CHESSBOARD */
    .arena { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 10px; gap: 15px; }
    
    .board-container {
      width: min(400px, 92vw);
      height: min(400px, 92vw);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 4px solid #161a2b;
      border-radius: 8px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);
      position: relative;
    }

    .square { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s ease; }
    .square.light { background: var(--board-light); }
    .square.dark { background: var(--board-dark); }
    
    .square.selected { background: rgba(0, 255, 102, 0.5) !important; box-shadow: inset 0 0 15px rgba(0,255,102,0.6); }
    .square.last-move { background: rgba(255, 204, 0, 0.45) !important; }
    
    .square.legal-move::after { content: ''; position: absolute; width: 25%; height: 25%; background: rgba(0, 255, 102, 0.7); border-radius: 50%; box-shadow: 0 0 10px rgba(0,255,102,0.9); z-index: 5; }
    .square.legal-capture::after { content: ''; position: absolute; inset: 4px; border: 4px solid rgba(255, 0, 85, 0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(255,0,85,0.6); z-index: 5; }

    .piece { position: absolute; font-size: min(3.2rem, 10vw); line-height: 1; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; pointer-events: none; transition: transform 0.1s ease; z-index: 10; }
    .white-piece { color: #ffffff; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6)); }
    .black-piece { color: #111111; filter: drop-shadow(0 1px 2px rgba(255,255,255,0.2)) drop-shadow(0 4px 6px rgba(0,0,0,0.8)); }
    .square:hover .piece { transform: scale(1.15); }

    .status-text { font-weight: 900; font-size: 1.1rem; color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 15px rgba(255,204,0,0.4); text-align: center; min-height: 1.5rem; }

    /* IN-GAME CHAT OVERLAY */
    .game-actions { display: flex; gap: 10px; margin-top: 5px; width: min(400px, 92vw); justify-content: space-between;}
    .chat-container { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: min(380px, 90vw); background: rgba(8,10,16,0.9); backdrop-filter: blur(10px); border: 1px solid var(--glass-light); border-radius: 16px; display: none; flex-direction: column; z-index: 100; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .chat-container.active { display: flex; animation: fadeSlideUp 0.2s ease-out; }
    .chat-history { height: 150px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
    .chat-msg { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 8px; align-self: flex-start; max-width: 90%; word-break: break-word; }
    .chat-msg.me { align-self: flex-end; background: rgba(0,255,102,0.15); color: #fff; }
    .chat-msg b { color: var(--muted); font-size: 0.75rem; display: block; margin-bottom: 2px; }
    .chat-msg.me b { display: none; }
    .chat-input-area { display: flex; border-top: 1px solid var(--glass-light); }
    .chat-input-area input { flex: 1; background: transparent; color: #fff; padding: 10px; }
    .chat-input-area button { background: var(--me); color: #000; font-weight: bold; padding: 0 15px; }

    /* OVERLAYS */
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; z-index: 200; text-align: center; padding: 20px; background: rgba(8,10,16,.85); backdrop-filter: blur(8px); }
    .overlay.hidden { display: none; }
    .start-btn { background: linear-gradient(135deg, var(--me), #00cc52); color: #000; font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; border: none; padding: 18px 46px; border-radius: 40px; cursor: pointer; box-shadow: 0 15px 35px rgba(0,255,102,.4); transition: .2s; }
    .start-btn:active { transform: scale(.92); }
    
    .countdown { font-size: 7rem; font-weight: 900; text-shadow: 0 0 40px rgba(0,255,102,.6); }
    .result h2 { font-size: 2.6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
    .result h2.win { color: var(--me); text-shadow: 0 0 30px rgba(0,255,102,.5); }
    .result h2.lose { color: var(--opp); text-shadow: 0 0 30px rgba(255,0,85,.5); }
    .result h2.draw { color: var(--gold); }
    
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(30px); background: #fff; color: #000; padding: 10px 20px; border-radius: 20px; font-weight: 700; opacity: 0; transition: .3s; z-index: 300; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* AVATAR SYSTEM */
    .avatar-wrapper { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.05); width: 34px; height: 34px; flex-shrink: 0; }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .gender-dot { position: absolute; bottom: -2%; right: -2%; width: 30%; height: 30%; border-radius: 50%; border: 1px solid var(--glass); z-index: 2; }
    .gender-male { background: #4cc9f0; } .gender-female { background: #ff6bcb; } .gender-none { background: #8f96a3; display:none; }

    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="btn-ghost">⬅ Leave</a>
    <div class="room-info">
      <div id="conn-dot" class="conn-status"></div>
      <div class="room-code" id="room-display">BOT MODE</div>
      <button class="btn-ghost" id="share-btn" style="display:none; padding:4px 10px;">Share</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="score-card me" id="card-me">
      <div id="my-avatar-slot"></div>
      <div class="player-details">
        <div class="player-name" id="my-name">You</div>
        <div class="timer-display" id="my-timer">10:00</div>
      </div>
    </div>
    
    <div class="score-card opp" id="card-opp">
      <div id="opp-avatar-slot"></div>
      <div class="player-details">
        <div class="player-name" id="opp-name">Opponent</div>
        <div class="timer-display" id="opp-timer">10:00</div>
      </div>
    </div>
  </div>

  <main class="arena" id="arena">
    <div class="status-text" id="game-status">Waiting...</div>
    
    <div class="board-container" id="chessboard"></div>

    <div class="game-actions">
      <button class="btn-ghost" id="btn-resign" style="color:var(--opp); border-color:rgba(255,0,85,0.2);">⚑ Resign</button>
      <button class="btn-primary" id="btn-toggle-chat" style="display:none;">💬 Chat</button>
    </div>

    <!-- IN GAME CHAT -->
    <div class="chat-container" id="chat-container">
      <div class="chat-history" id="chat-history"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type message..." maxlength="150" autocomplete="off">
        <button id="btn-send-chat">➤</button>
      </div>
    </div>

    <!-- OVERLAYS -->
    <div class="overlay" id="start-overlay" style="gap: 12px;">
      <div id="wait-msg" style="display:none; font-weight:800; font-size:1.5rem; text-transform:uppercase;">Waiting for opponent...</div>
      
      <!-- Game Mode Selection -->
      <div id="mode-selection" style="display:flex; flex-direction:column; gap:12px; width:100%; max-width:300px;">
        <button class="start-btn" id="btn-local" style="font-size:1.1rem; padding:14px 20px; margin-bottom:8px;">👥 Play with Friend (Same Phone)</button>
        
        <div style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-light); padding: 16px; border-radius: 20px; display:flex; flex-direction:column; gap:10px;">
          <div style="font-weight:800; color:var(--muted); font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;">Play vs Bot</div>
          <div style="display:flex; gap:8px; justify-content:center;">
            <button class="btn-ghost" id="btn-bot-normal" style="flex:1; background:rgba(0,255,102,0.1); border-color:rgba(0,255,102,0.3); color:var(--me);">Normal</button>
            <button class="btn-ghost" id="btn-bot-hard" style="flex:1; background:rgba(255,204,0,0.1); border-color:rgba(255,204,0,0.3); color:var(--gold);">Hard</button>
            <button class="btn-ghost" id="btn-bot-extreme" style="flex:1; background:rgba(255,0,85,0.1); border-color:rgba(255,0,85,0.3); color:var(--opp);">Extreme</button>
          </div>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="count-overlay" style="background:transparent;"><div class="countdown" id="countdown">3</div></div>

    <div class="overlay result hidden" id="result-overlay">
      <h2 id="result-title">Checkmate!</h2>
      <p id="result-desc" style="color:var(--muted); margin-bottom:20px;">You won the game.</p>
      <div style="display:flex; gap:10px;">
        <button class="start-btn" id="again-btn">Rematch</button>
        <button class="btn-ghost" onclick="location.href='index.html'" style="font-size:1.2rem;">Leave</button>
      </div>
      <div id="rematch-wait" style="display:none; color:var(--gold); margin-top:10px; font-weight:700;">Waiting for opponent...</div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
  (() => {
    // --- 1. SETUP & UTILS ---
    const $ = id => document.getElementById(id);
    const store = { get(k, d) { try { const v = localStorage.getItem(k); return v===null?d:v; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

    const sfx = { tick() {}, go() {} };

    function renderAvatar(user, sizePx = 34) {
      const wrapper = document.createElement('div');
      wrapper.className = 'avatar-wrapper';
      wrapper.style.width = `${sizePx}px`; wrapper.style.height = `${sizePx}px`;
      if (user.avatarType === 'photo' && user.avatar && user.avatar.startsWith('data:image/')) {
        const img = document.createElement('img'); img.src = user.avatar; wrapper.appendChild(img);
      } else {
        const txt = document.createElement('div'); txt.textContent = (user.avatar || '🤖').substring(0, 8); txt.style.fontSize = `${sizePx * 0.6}px`; wrapper.appendChild(txt);
      }
      if (user.gender && user.gender !== 'none') {
        const dot = document.createElement('div'); dot.className = `gender-dot gender-${user.gender}`; wrapper.appendChild(dot);
      }
      return wrapper;
    }

    function toast(m) {
      const t = $('toast'); t.textContent = m; t.classList.add('show');
      clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2000);
    }

    let currentUser = { id: 'local', name: 'You', avatar: '🤖', avatarType: 'emoji', gender: 'none' };
    try { const u = JSON.parse(store.get('swiplay_user', 'null')); if (u && u.name) currentUser = u; } catch {}

    const mySlot = $('my-avatar-slot'); mySlot.innerHTML = ''; mySlot.appendChild(renderAvatar(currentUser));
    $('my-name').textContent = currentUser.name;
    const oppSlot = $('opp-avatar-slot'); oppSlot.innerHTML = ''; oppSlot.appendChild(renderAvatar({avatar:'♟️', avatarType:'emoji', gender:'none'}));

    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'bot';
    const roomId = params.get('room') || '';

    // --- 2. GAME STATE ---
    const S = {
      isLive: mode !== 'bot',
      phase: 'idle', // idle, countdown, playing, over
      game: new Chess(),
      myColor: 'w',
      botColor: 'b',
      isLocal: false,
      isBotMode: false,
      botDifficulty: 'normal',
      selected: null,
      legalMoves: [],
      lastMove: null,
      clocks: { w: 300000, b: 300000 }, // 5 mins in ms
      clockInterval: null,
      lastTick: 0,
      countdownRAF: null
    };

    const solidPieces = { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' };

    // --- 3. UI RENDERING ---
    function renderBoard() {
      const boardEl = $('chessboard');
      boardEl.innerHTML = '';
      const boardState = S.game.board();
      const isBlack = S.myColor === 'b';

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const r = isBlack ? 7 - row : row;
          const c = isBlack ? 7 - col : col;

          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 1 ? 'dark' : 'light'}`;
          
          const squareCoord = getSquareAlgebraic(r, c);
          
          if (S.lastMove && (squareCoord === S.lastMove.from || squareCoord === S.lastMove.to)) square.classList.add('last-move');
          if (S.selected === squareCoord) square.classList.add('selected');
          
          const moveInfo = S.legalMoves.find(m => m.to === squareCoord);
          if (moveInfo) square.classList.add(moveInfo.captured ? 'legal-capture' : 'legal-move');

          const pieceObj = boardState[r][c];
          if (pieceObj) {
            const span = document.createElement('span');
            span.className = `piece ${pieceObj.color === 'w' ? 'white-piece' : 'black-piece'}`;
            span.textContent = solidPieces[pieceObj.type];
            square.appendChild(span);
          }

          square.onclick = () => handleSquareClick(r, c);
          boardEl.appendChild(square);
        }
      }
      updateStatus();
    }

    function getSquareAlgebraic(r, c) {
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
      return files[c] + ranks[r];
    }

    function formatTime(ms) {
      if (!ms || ms <= 0) return "00:00";
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function renderClocks(wTime, bTime) {
      const myTime = S.myColor === 'w' ? wTime : bTime;
      const oppTime = S.myColor === 'w' ? bTime : wTime;
      
      const myT = $('my-timer');
      const oppT = $('opp-timer');
      
      myT.textContent = formatTime(myTime);
      oppT.textContent = formatTime(oppTime);

      myT.classList.toggle('danger', myTime < 30000 && myTime > 0);
      oppT.classList.toggle('danger', oppTime < 30000 && oppTime > 0);

      if (S.phase === 'playing') {
        const tColor = S.game.turn();
        $('card-me').classList.toggle('active-turn', S.myColor === tColor);
        $('card-opp').classList.toggle('active-turn', S.myColor !== tColor);
      } else {
        $('card-me').classList.remove('active-turn'); $('card-opp').classList.remove('active-turn');
      }
    }

    function updateStatus() {
      const sEl = $('game-status');
      if (S.phase !== 'playing') return;

      if (S.game.in_checkmate()) sEl.textContent = 'Checkmate!';
      else if (S.game.in_draw() || S.game.in_stalemate() || S.game.in_threefold_repetition()) sEl.textContent = 'Draw Game';
      else if (S.game.in_check()) sEl.textContent = 'Check!';
      else sEl.textContent = S.game.turn() === S.myColor ? "Your Turn" : "Opponent's Turn";
    }

    // --- 4. GAME MECHANICS ---
    function startBotGame() {
      S.isLocal = false;
      S.isBotMode = true;
      startLocalCountdown();
    }

    function startLocalCountdown() {
      clearInterval(S.clockInterval);
      if (S.countdownRAF) { cancelAnimationFrame(S.countdownRAF); S.countdownRAF = null; }
      
      S.game.reset(); 
      S.myColor = 'w'; 
      S.botColor = 'b';
      S.lastMove = null; S.selected = null; S.legalMoves = [];
      S.clocks = { w: 300000, b: 300000 };
      S.phase = 'countdown';
      
      renderBoard(); renderClocks(S.clocks.w, S.clocks.b);

      $('start-overlay').classList.add('hidden'); 
      $('result-overlay').classList.add('hidden'); 
      $('count-overlay').classList.remove('hidden');
      
      let n = 3;
      const step = () => {
        if (n > 0) { 
          $('countdown').textContent = n; 
          $('countdown').style.animation = 'none'; void $('countdown').offsetWidth; $('countdown').style.animation = ''; 
          sfx.tick(); n--; setTimeout(step, 700); 
        } 
        else { 
          $('countdown').textContent = 'GO!'; sfx.go(); 
          setTimeout(() => { 
            $('count-overlay').classList.add('hidden'); 
            S.phase = 'playing'; 
            startClockTicker(); 
            updateStatus(); 
          }, 400); 
        }
      };
      step();
    }

    function makeBotMove() {
      if (S.game.game_over() || S.phase !== 'playing' || !S.isBotMode) return;
      if (S.game.turn() === S.myColor) return;

      const moves = S.game.moves({ verbose: true });
      if (!moves.length) { endMatchLocal(); return; }

      let chosenMove;

      if (S.botDifficulty === 'normal') {
        const captures = moves.filter(m => m.captured);
        const pool = captures.length > 0 && Math.random() > 0.3 ? captures : moves;
        chosenMove = pool[Math.floor(Math.random() * pool.length)];
      } 
      else if (S.botDifficulty === 'hard') {
        chosenMove = getBestMove(moves, 2);
      } 
      else if (S.botDifficulty === 'extreme') {
        chosenMove = getBestMove(moves, 3);
      }

      S.game.move(chosenMove);
      S.lastMove = { from: chosenMove.from, to: chosenMove.to };
      renderBoard();
      
      if (S.game.game_over()) endMatchLocal();
    }

    function getBestMove(moves, depth) {
      let bestScore = -Infinity;
      let bestMoves = [];
      const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 9000 };
      
      moves.forEach(move => {
        S.game.move(move);
        let score = -minimax(depth - 1, -Infinity, Infinity, false, pieceValues);
        S.game.undo();
        score += Math.random() * 5;
        if (score > bestScore) {
          bestScore = score;
          bestMoves = [move];
        } else if (score === bestScore) {
          bestMoves.push(move);
        }
      });
      return bestMoves[Math.floor(Math.random() * bestMoves.length)];
    }

    function minimax(depth, alpha, beta, isMaximizing, pieceValues) {
      if (depth === 0 || S.game.game_over()) {
        if (S.game.in_checkmate()) return isMaximizing ? -9999 : 9999;
        if (S.game.in_draw() || S.game.in_stalemate()) return 0;
        return evaluateBoard(pieceValues);
      }

      const moves = S.game.moves({ verbose: true });
      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const move of moves) {
          S.game.move(move);
          const ev = minimax(depth - 1, alpha, beta, false, pieceValues);
          S.game.undo();
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const move of moves) {
          S.game.move(move);
          const ev = minimax(depth - 1, alpha, beta, true, pieceValues);
          S.game.undo();
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function evaluateBoard(pieceValues) {
      let totalEvaluation = 0;
      S.game.board().forEach(row => {
        row.forEach(piece => {
          if (piece) {
            const val = pieceValues[piece.type];
            totalEvaluation += (piece.color === 'w' ? val : -val);
          }
        });
      });
      return totalEvaluation;
    }

    function handleSquareClick(r, c) {
      if (S.phase !== 'playing') return;
      
      if (S.isBotMode && S.game.turn() !== S.myColor) return;

      const clickedCoord = getSquareAlgebraic(r, c);

      if (S.selected === clickedCoord) {
        S.selected = null; S.legalMoves = [];
      } else if (S.selected) {
        const moveAttempt = { from: S.selected, to: clickedCoord, promotion: 'q' };
        const moveRegex = S.game.moves({ verbose: true }).find(m => m.from === moveAttempt.from && m.to === moveAttempt.to);

        if (moveRegex) {
          S.selected = null; S.legalMoves = [];
          
          if (S.isLive) {
            socket.emit('chess:move', moveAttempt);
          } else {
            S.game.move(moveAttempt);
            S.lastMove = { from: moveAttempt.from, to: moveAttempt.to };
            renderBoard();
            
            if (S.game.game_over()) {
              endMatchLocal();
            } 
            else if (S.isBotMode) {
              setTimeout(makeBotMove, 400); 
            }
          }
        } else {
          const piece = S.game.get(clickedCoord);
          const canSelect = S.isLocal || (piece && piece.color === S.myColor);
          
          if (piece && canSelect) {
            S.selected = clickedCoord; S.legalMoves = S.game.moves({ square: clickedCoord, verbose: true });
          } else { S.selected = null; S.legalMoves = []; }
        }
      } else {
        const piece = S.game.get(clickedCoord);
        const canSelect = S.isLocal || (piece && piece.color === S.myColor);
        if (piece && canSelect) {
          S.selected = clickedCoord; S.legalMoves = S.game.moves({ square: clickedCoord, verbose: true });
        }
      }
      renderBoard();
    }

    function endMatchLocal(reasonOverride) {
      if (S.phase === 'over') return;
      S.phase = 'over'; clearInterval(S.clockInterval);
      let resTitle = "Game Over"; let colorCls = "draw"; let desc = "Game drawn.";

      if (reasonOverride === 'resign') {
        resTitle = "Defeat!"; colorCls = "lose"; desc = "You resigned the game.";
      } else if (reasonOverride === 'timeout') {
        const iRanOut = (S.myColor === 'w' && S.clocks.w <= 0) || (S.myColor === 'b' && S.clocks.b <= 0);
        if (iRanOut) { resTitle = "Defeat!"; colorCls = "lose"; desc = "You ran out of time."; }
        else { resTitle = "Victory!"; colorCls = "win"; desc = "Opponent ran out of time."; }
      } else if (S.game.in_checkmate()) {
        const win = S.game.turn() !== S.myColor;
        resTitle = win ? "Victory!" : "Defeat!";
        colorCls = win ? "win" : "lose";
        desc = win ? "You checkmated the opponent." : "You were checkmated.";
      } else if (S.game.in_stalemate()) { resTitle = "Draw"; colorCls = "draw"; desc = "Stalemate."; }
      else if (S.game.in_threefold_repetition()) { resTitle = "Draw"; colorCls = "draw"; desc = "Threefold repetition."; }
      else if (S.game.insufficient_material()) { resTitle = "Draw"; colorCls = "draw"; desc = "Insufficient material."; }
      else if (S.game.in_draw()) { resTitle = "Draw"; colorCls = "draw"; desc = "Game drawn."; }

      showResult(resTitle, colorCls, desc);
    }

    function showResult(title, colorCls, desc) {
      $('result-title').textContent = title;
      $('result-title').className = colorCls;
      $('result-desc').textContent = desc;
      $('result-overlay').classList.remove('hidden');
    }

    // --- 5. NETWORKING & LIVE PLAY ---
    let socket = null;
    let liveTimeout = null;

    function setupBotMode() {
      $('mode-selection').style.display = 'flex';
      $('wait-msg').style.display = 'none';
      $('start-overlay').classList.remove('hidden');
      
      $('btn-resign').onclick = () => {
        if (S.phase === 'playing') endMatchLocal('resign');
      };

      $('btn-local').addEventListener('click', () => {
        S.isBotMode = false;
        S.isLocal = true;
        startLocalCountdown();
      });

      $('btn-bot-normal').addEventListener('click', () => { S.botDifficulty = 'normal'; startBotGame(); });
      $('btn-bot-hard').addEventListener('click', () => { S.botDifficulty = 'hard'; startBotGame(); });
      $('btn-bot-extreme').addEventListener('click', () => { S.botDifficulty = 'extreme'; startBotGame(); });
    }

    if (S.isLive) {
      $('mode-selection').style.display = 'none';
      $('wait-msg').style.display = 'flex';
      $('btn-toggle-chat').style.display = 'block';
      if (mode === 'friend') {
        $('room-display').textContent = 'ROOM: ' + roomId;
        $('share-btn').style.display = 'block';
        $('share-btn').onclick = () => {
          const url = location.origin + location.pathname + '?mode=friend&room=' + encodeURIComponent(roomId);
          if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link copied!')).catch(() => toast(url));
          else toast(url);
        };
      } else {
        $('room-display').textContent = 'MATCHMAKING';
      }

      if (SERVER_URL.includes('YOUR-SERVER')) {
        $('wait-msg').innerHTML = '';
        const h3 = document.createElement('h3'); h3.textContent = "Live server not configured.";
        const b2 = document.createElement('button'); b2.className = 'btn-primary'; b2.textContent = "Play vs Bot"; b2.style.marginTop = '12px';
        b2.onclick = () => location.href = location.pathname + '?mode=bot';
        $('wait-msg').append(h3, b2);
        $('btn-resign').onclick = () => { if (S.phase === 'playing') endMatchLocal('resign'); };
      } else {
        const dot = $('conn-dot'); dot.className = 'conn-status offline';
        socket = io(SERVER_URL);

        liveTimeout = setTimeout(() => {
          if (S.phase === 'idle') {
            $('wait-msg').innerHTML = '';
            const h3 = document.createElement('h3'); h3.textContent = "Could not connect to match.";
            const b2 = document.createElement('button'); b2.className = 'btn-primary'; b2.textContent = "Play vs Bot"; b2.style.marginTop = '12px';
            b2.onclick = () => location.href = location.pathname + '?mode=bot';
            $('wait-msg').append(h3, b2);
          }
        }, 45000);

        socket.on('connect', () => {
          dot.className = 'conn-status online'; $('wait-msg').textContent = "Waiting for opponent...";
          socket.emit('hello', currentUser); socket.emit('game:ready', { roomId });
        });
        socket.on('disconnect', () => { dot.className = 'conn-status offline'; });

        socket.on('match:start', (payload = {}) => {
          clearTimeout(liveTimeout);
          const { startAt, profiles = [], serverNow, fen, clocks } = payload;
          S.clockOffset = serverNow ? serverNow - Date.now() : 0;
          S.clockOffset = S.clockOffset || 0;

          const me = profiles.find(p => p.userId === currentUser.id);
          S.myColor = me && me.color ? me.color : 'w';
          const opp = profiles.find(p => p.userId !== currentUser.id) || { profile: {name:'Opponent', avatar:'🤖', gender:'none'} };

          oppSlot.innerHTML = ''; oppSlot.appendChild(renderAvatar(opp.profile, 34));
          $('opp-name').textContent = opp.profile.name;

          if (fen) S.game.load(fen); else S.game.reset();
          S.clocks = clocks || { w: 300000, b: 300000 };
          S.lastMove = null; S.selected = null; S.legalMoves = [];
          renderBoard(); renderClocks(S.clocks.w, S.clocks.b);

          if (startAt) syncCountdown(startAt);
          else { 
            $('start-overlay').classList.add('hidden');
            S.phase = 'playing'; startClockTicker(); updateStatus();
          }
        });

        socket.on('chess:state', ({ fen, clocks, lastMove } = {}) => {
          if (fen) S.game.load(fen);
          if (clocks) S.clocks = clocks;
          S.lastMove = lastMove || null;
          renderBoard(); renderClocks(S.clocks.w, S.clocks.b);
        });

        socket.on('match:end', ({ winnerId, reason } = {}) => {
          S.phase = 'over'; clearInterval(S.clockInterval);
          let title = "Draw Game"; let cls = "draw"; let desc = "The match ended in a draw.";
          if (winnerId) {
            const win = winnerId === currentUser.id;
            title = win ? "Victory!" : "Defeat!"; cls = win ? "win" : "lose";
            desc = win ? `You won by ${reason}.` : `You lost by ${reason}.`;
          } else if (reason) { desc = `Draw by ${reason}.`; }
          showResult(title, cls, desc);
        });

        socket.on('match:rematch_start', () => {
          $('rematch-wait').style.display = 'none'; $('again-btn').style.display = 'block';
          socket.emit('game:ready', { roomId });
        });

        socket.on('error:toast', (msg) => {
          toast(msg);
          const lower = (msg || '').toLowerCase();
          if (lower.includes('disconnected') || lower.includes('left')) {
            if (S.phase === 'over') { $('again-btn').style.display = 'none'; $('rematch-wait').style.display = 'block'; $('rematch-wait').textContent = "Opponent left."; }
          }
        });

        socket.on('game:chat_receive', ({ name, text, senderId } = {}) => {
          addInGameChat(name || 'Opponent', text || '', senderId === currentUser.id);
        });

        $('btn-resign').onclick = () => { if (S.phase === 'playing') socket.emit('chess:resign'); };
      }
    } else {
      $('share-btn').style.display = 'none';
      setupBotMode();
    }

    $('again-btn').addEventListener('click', () => {
      if (S.isLive && socket) {
        socket.emit('match:rematch');
        $('again-btn').style.display = 'none'; $('rematch-wait').style.display = 'block';
      } else {
        if (S.isBotMode) startBotGame();
        else startLocalCountdown();
      }
    });

    // --- 6. TIMERS & SYNC ---
    function syncCountdown(startAt) {
      if (S.countdownRAF) { cancelAnimationFrame(S.countdownRAF); S.countdownRAF = null; }
      $('start-overlay').classList.add('hidden'); $('result-overlay').classList.add('hidden'); $('count-overlay').classList.remove('hidden');
      $('rematch-wait').style.display = 'none'; $('again-btn').style.display = 'block';
      S.phase = 'countdown';

      const step = () => {
        if (S.phase !== 'countdown') return;
        const left = startAt - (Date.now() + S.clockOffset);
        if (left > 400) {
          const n = Math.ceil(left / 1000);
          if ($('countdown').textContent !== String(n)) {
            $('countdown').textContent = n;
            $('countdown').style.animation = 'none'; void $('countdown').offsetWidth; $('countdown').style.animation = '';
            sfx.tick();
          }
          S.countdownRAF = requestAnimationFrame(step);
        } else {
          $('countdown').textContent = 'GO!'; sfx.go();
          setTimeout(() => {
            $('count-overlay').classList.add('hidden');
            S.phase = 'playing'; startClockTicker(); updateStatus();
          }, 400);
        }
      };
      step();
    }

    function startClockTicker() {
      clearInterval(S.clockInterval);
      S.lastTick = Date.now();
      S.clockInterval = setInterval(() => {
        if (S.phase !== 'playing') return;
        const now = Date.now();
        const dt = now - S.lastTick;
        S.lastTick = now;

        if (S.game.turn() === 'w') S.clocks.w = Math.max(0, S.clocks.w - dt);
        else S.clocks.b = Math.max(0, S.clocks.b - dt);

        renderClocks(S.clocks.w, S.clocks.b);

        if (!S.isLive && (S.clocks.w <= 0 || S.clocks.b <= 0)) endMatchLocal('timeout');
      }, 100);
    }

    // --- 7. IN-GAME CHAT ---
    const chatBtn = $('btn-toggle-chat');
    const chatBox = $('chat-container');
    const chatInp = $('chat-input');
    const chatSend = $('btn-send-chat');
    const chatHist = $('chat-history');

    chatBtn.onclick = () => {
      chatBox.classList.toggle('active');
      if (chatBox.classList.contains('active')) chatInp.focus();
    };

    function addInGameChat(name, text, isMe) {
      const msg = document.createElement('div'); msg.className = `chat-msg ${isMe ? 'me' : ''}`;
      const b = document.createElement('b'); b.textContent = name;
      const t = document.createTextNode(text);
      msg.append(b, t); chatHist.appendChild(msg); chatHist.scrollTop = chatHist.scrollHeight;
      if (!chatBox.classList.contains('active')) {
        chatBtn.style.color = 'var(--me)';
        setTimeout(() => { chatBtn.style.color = ''; }, 2000);
        sfx.tick();
      }
    }

    function sendGameChat() {
      const txt = chatInp.value.trim(); if (!txt) return;
      if (S.isLive && socket) socket.emit('game:chat', txt);
      else addInGameChat(currentUser.name, txt, true);
      chatInp.value = '';
    }
    chatSend.onclick = sendGameChat;
    chatInp.onkeypress = (e) => { if (e.key === 'Enter') sendGameChat(); };

    // Initial render
    renderBoard(); renderClocks(S.clocks.w, S.clocks.b);
  })();
  </script>
</body>
